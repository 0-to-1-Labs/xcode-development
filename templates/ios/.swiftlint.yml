# SwiftLint config. Formatting rules that overlap with swift-format are off.
included:
  - Sources
  - Tests
  - UITests
excluded:
  - build
  - .build
  - DerivedData
reporter: xcode
strict: false

disabled_rules:
  - trailing_comma          # swift-format owns this
  - opening_brace           # swift-format owns this
  - trailing_whitespace     # swift-format owns this
  - vertical_whitespace     # swift-format owns this
  - todo                    # TODOs are fine during iteration
  - type_body_length        # SwiftUI views get long

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
function_body_length:
  warning: 60
  error: 120
file_length:
  warning: 500
  error: 800
identifier_name:
  min_length: 2
  excluded: [x, y, z, i, j, dx, dy, id]
force_unwrapping: error
force_cast: error
force_try: error
