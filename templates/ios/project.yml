# XcodeGen spec. This file is the source of truth; the .xcodeproj is generated
# and gitignored. Edit this, then run `make generate`.
name: __APP_NAME__
options:
  bundleIdPrefix: __BUNDLE_PREFIX__
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "27.0"

configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

settings:
  base:
    # Match Xcode 26/27 new-project defaults. Swift 5 language mode keeps
    # concurrency diagnostics as warnings. MainActor default isolation and
    # approachable concurrency remove most "Sendable" noise in UI code.
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM comes from Configs/Local.xcconfig (gitignored).
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
  configs:
    Debug:
      SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    Release:
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  __APP_NAME__:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_PREFIX__.__APP_NAME__
        PRODUCT_NAME: __APP_NAME__
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "__DISPLAY_NAME__"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - name: __APP_NAME__Tests
          parallelizable: true
          randomExecutionOrder: true
        - name: __APP_NAME__UITests
      gatherCoverageData: true
      coverageTargets:
        - __APP_NAME__

  __APP_NAME__Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: __APP_NAME__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_PREFIX__.__APP_NAME__Tests
        GENERATE_INFOPLIST_FILE: YES

  __APP_NAME__UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: __APP_NAME__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_PREFIX__.__APP_NAME__UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: __APP_NAME__
